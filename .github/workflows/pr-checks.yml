name: Pull Request Checks

on:
    pull_request:
        branches: [main]

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "yarn"

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Type check (vue-tsc)
              run: npx -y vue-tsc@latest --noEmit

            - name: Build
              env:
                  NODE_ENV: production
              run: yarn build
